<!DOCTYPE html><html class="dark" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><title>Splash Onboarding</title><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#09090b;}body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#0f0f12", "on-secondary-fixed-variant": "#3f3f46", "secondary-fixed-dim": "#71717a", "secondary-container": "#27272a", "surface-container-lowest": "#09090b", "tertiary": "#34d399", "on-secondary": "#09090b", "on-surface-variant": "#a1a1aa", "on-error-container": "#fca5a5", "surface": "#0c0c0f", "inverse-surface": "#fafafa", "tertiary-container": "#065f46", "tertiary-fixed-dim": "#6ee7b7", "on-secondary-container": "#a1a1aa", "outline": "#52525b", "on-tertiary-container": "#bbf7d0", "background": "#09090b", "tertiary-fixed": "#bbf7d0", "secondary-fixed": "#a1a1aa", "surface-container-high": "#18181b", "on-primary": "#0a0012", "surface-dim": "#0c0c0f", "surface-container-highest": "#1e1e22", "secondary": "#71717a", "surface-tint": "#a78bfa", "on-primary-fixed": "#2e1065", "inverse-primary": "#5b21b6", "on-surface": "#fafafa", "error": "#ef4444", "error-container": "#3b1111", "on-background": "#fafafa", "surface-variant": "#18181b", "primary-fixed-dim": "#c4b5fd", "primary-fixed": "#ede9fe", "on-secondary-fixed": "#18181b", "surface-container": "#121215", "on-tertiary": "#001a12", "primary-container": "#7c3aed", "outline-variant": "#27272a", "surface-bright": "#18181b", "on-tertiary-fixed-variant": "#047857", "inverse-on-surface": "#09090b", "on-primary-fixed-variant": "#5b21b6", "primary": "#a78bfa", "on-primary-container": "#ede9fe", "on-tertiary-fixed": "#003318", "on-error": "#1a0000" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: {}, fontFamily: { "headline": ["Geist", "sans-serif"], "display": ["Geist", "sans-serif"], "body": ["Geist", "sans-serif"], "label": ["Geist", "sans-serif"] }, fontSize: {} } } }</script></head><body class="bg-background font-body text-on-surface min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary selection:text-on-primary"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full pb-24 text-on-surface">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-3 bg-surface">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h1 class="text-xl font-headline font-semibold tracking-tight text-on-surface">Add Manually</h1>
<div class="w-10"></div>
</header>
<!-- Form Section -->
<div class="px-4 py-2 space-y-1"><div class="mb-3"><label class="flex flex-col items-center justify-center h-36 w-full border-2 border-dashed border-outline-variant rounded-xl cursor-pointer bg-surface-container hover:bg-surface-container-high transition-colors relative overflow-hidden group"><div class="flex flex-col items-center justify-center pt-5 pb-6 text-on-surface-variant"><span class="material-symbols-outlined text-3xl mb-1 text-primary">photo_camera</span><span class="text-xs font-medium">Add photo</span></div><input type="file" class="hidden" accept="image/*"></label></div>
<!-- Row 1: Food Name -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Food Name</span>
<input class="bg-transparent text-right font-medium text-on-surface focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1 max-w-[200px]" type="text" value="Custom Meal">
</div>
<!-- Row 2: Serving Size -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Serving Size</span>
<div class="flex items-center space-x-2">
<input class="bg-transparent text-right font-medium text-on-surface w-16 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1" type="number" value="100">
<select class="bg-surface-container-high text-on-surface text-sm rounded px-2 py-1 focus:outline-none">
<option selected="">g</option>
<option>oz</option>
<option>ml</option>
<option>cup</option>
</select>
</div>
</div>
<!-- Row 3: Calories -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<div class="flex flex-col">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Calories</span>
<span class="text-[9px] text-tertiary">Auto-calculated from macros</span>
</div>
<div class="flex items-center space-x-1">
<input class="bg-transparent text-right font-medium text-tertiary w-20 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1 opacity-90" type="number" value="340">
<span class="text-xs text-on-surface-variant">kcal</span>
</div>
</div>
<!-- Row 4: Protein -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Protein</span>
<div class="flex items-center space-x-1">
<input class="bg-transparent text-right font-medium text-on-surface w-16 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1" type="number" value="28">
<span class="text-xs text-on-surface-variant">g</span>
</div>
</div>
<!-- Row 5: Carbs -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Carbs</span>
<div class="flex items-center space-x-1">
<input class="bg-transparent text-right font-medium text-on-surface w-16 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1" type="number" value="32">
<span class="text-xs text-on-surface-variant">g</span>
</div>
</div>
<!-- Row 6: Fat -->
<div class="flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Fat</span>
<div class="flex items-center space-x-1">
<input class="bg-transparent text-right font-medium text-on-surface w-16 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1" type="number" value="12">
<span class="text-xs text-on-surface-variant">g</span>
</div>
</div>
<!-- Optional Fiber Row & Add Link -->
<div class="pt-2">
<button class="text-xs font-medium text-primary hover:text-primary-fixed-dim transition-colors flex items-center space-x-1 mb-2" id="add-fiber-btn" onclick="document.getElementById('fiber-row').classList.toggle('hidden'); this.classList.toggle('hidden');">
<span class="material-symbols-outlined text-sm">add</span>
<span class="">Add fiber</span>
</button>
<div class="hidden flex items-center justify-between py-3 px-4 bg-surface-container rounded-lg mb-1" id="fiber-row">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase">Fiber</span>
<div class="flex items-center space-x-1">
<input class="bg-transparent text-right font-medium text-on-surface w-16 focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1" type="number" value="4">
<span class="text-xs text-on-surface-variant">g</span>
</div>
</div>
</div>
</div>
<!-- Meal Assignment Section -->
<div class="px-4 py-4">
<span class="text-[10px] font-bold tracking-wider text-on-surface-variant uppercase block mb-2">Meal Assignment</span>
<div class="grid grid-cols-4 gap-2">
<button class="py-2.5 px-2 rounded-lg text-xs font-semibold bg-blue-600 text-on-surface shadow-sm transition-all text-center">Breakfast</button>
<button class="py-2.5 px-2 rounded-lg text-xs font-semibold bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all text-center">Lunch</button>
<button class="py-2.5 px-2 rounded-lg text-xs font-semibold bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all text-center">Dinner</button>
<button class="py-2.5 px-2 rounded-lg text-xs font-semibold bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all text-center">Snack</button>
</div>
</div>
<!-- Bottom Action -->
<div class="px-4 py-3">
<button class="w-full py-4 rounded-xl font-semibold bg-blue-600 text-on-surface text-sm shadow-lg hover:bg-blue-500 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
<span class="material-symbols-outlined">check</span>
<span class="">Add to Meal</span>
</button>
</div>
<!-- Persistent Bottom Navigation -->
<nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-surface-container-low/95 backdrop-blur-md px-6 py-3 flex items-center justify-between z-50 rounded-t-3xl"><a class="flex flex-col items-center text-on-surface-variant hover:text-on-surface p-1" href="#"><span class="material-symbols-outlined text-secondary">grid_view</span></a><a class="flex flex-col items-center text-on-surface-variant hover:text-on-surface p-1" href="#"><span class="material-symbols-outlined text-primary">monitoring</span></a><a class="flex flex-col items-center text-on-primary bg-primary rounded-full p-4 shadow-lg -mt-8 hover:bg-primary-container transition-transform active:scale-95" href="#"><span class="material-symbols-outlined text-on-primary">barcode_scanner</span></a><a class="flex flex-col items-center text-on-surface-variant p-1" href="#"><span class="material-symbols-outlined text-secondary">restaurant</span></a><a class="flex flex-col items-center text-on-surface-variant hover:text-on-surface p-1" href="#"><span class="material-symbols-outlined text-secondary">settings</span></a></nav>
</div></main>

</body></html>
