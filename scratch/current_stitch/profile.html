    function openSetting(name) {

      const notification = document.createElement('div');
      notification.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-surface-container-highest text-on-surface px-4 py-2 rounded-full text-xs font-headline shadow-xl border border-outline-variant transition-all duration-300 z-50 flex items-center gap-2';

        notification.style.opacity = '0';
