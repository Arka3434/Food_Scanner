"on-secondary": "#09090b",          "surface-bright": "#18181b",          "inverse-on-surface": "#09090b",          "on-primary-fixed": "#2e1065",          "tertiary-container": "#065f46",          "surface-container": "#121215",          "surface-tint": "#a78bfa",          "background": "#09090b",          "on-error-container": "#fca5a5",          "primary": "#a78bfa",          "surface": "#0c0c0f",          "surface-container-highest": "#1e1e22",          "on-primary-container": "#ede9fe",          "on-secondary-container": "#a1a1aa",          "surface-variant": "#18181b"        },        "borderRadius": {          "DEFAULT": "0.25rem",          "lg": "0.5rem",          "xl": "0.75rem",          "full": "9999px"        },        "fontFamily": {          "headline": ["Geist"],          "display": ["Geist"],          "body": ["Geist"],          "label": ["Geist"]        }      },    },  }</script><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  </head><body class="bg-background font-body text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background/80 backdrop-blur-xl pt-safe"><div class="h-16 px-6 flex items-center justify-between"><span class="text-xl font-headline font-bold tracking-tight text-on-surface">Scanner</span><div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined text-on-surface text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-6 pt-16 pb-28 bg-background"><div class="flex flex-col w-full relative min-h-[calc(100vh-8rem)] select-none">
<!-- Full Screen Live Camera Viewfinder (Simulated) -->
<div class="fixed inset-0 bg-[#0E0F0D] z-0 flex flex-col justify-between overflow-hidden">
<!-- Camera Background / Plate Simulation -->
<div class="absolute inset-0 bg-cover bg-center opacity-40 mix-blend-luminosity" data-alt="A close up top-down view of a colorful healthy poke bowl on a dark slate table, vibrant fresh ingredients, dramatic culinary lighting, moody dark aesthetic with glowing neon green accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBgMIiyBmS3OsnwFvMLvbPfN0tzEzh6mRr0TAkhP_NL31kisloNqvfn8BqYTGkEaIRf8LRs0vsEB6zJ2ZxyBF81zBYDJFD2bq9iYeHJ31OCV_GW2y8SLaN1LDVkdByJFFv16fUPHPEr5YYkVwixfRmkJSvEA_ABx5ML1jiCQJinPP8QYSRIPbCCy0cGfLnL1EFXkbpsI3GUPZQCNO2-5pkWSZuEB_3MTRnnfodcHYGomc2vQbNGYX0')"></div>
<!-- Top Toolbar (Absolute overlay) -->
<div class="relative z-20 flex items-center justify-between px-6 pt-16">
<button class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-md flex items-center justify-center text-on-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Frosted Pill "Hold steady" -->
<div class="px-4 py-1.5 rounded-full bg-surface-container/60 backdrop-blur-md border border-outline-variant/30 flex items-center gap-2 shadow-lg">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="text-xs font-headline font-medium tracking-wide text-on-surface">Hold steady</span>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-md flex items-center justify-center text-on-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">bolt</span>
</button>
</div>
<!-- Center Focus Frame with Four Thin Lime Corner Brackets -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-8 pointer-events-none">
<div class="relative w-72 h-96 max-w-full">
<!-- Top Left Bracket -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-tertiary rounded-tl-sm"></div>
<!-- Top Right Bracket -->
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-tertiary rounded-tr-sm"></div>
<!-- Bottom Left Bracket -->
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-tertiary rounded-bl-sm"></div>
<!-- Bottom Right Bracket -->
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-tertiary rounded-br-sm"></div>
<!-- Scanning laser line animation -->
<div class="absolute inset-x-0 h-[2px] bg-gradient-to-r from-transparent via-tertiary to-transparent animate-bounce opacity-80 top-1/2"></div>
</div>
<div class="mt-4 text-center pointer-events-auto">
<span class="text-[11px] font-headline tracking-widest uppercase text-tertiary font-semibold px-3 py-1 rounded-full bg-tertiary/10 backdrop-blur-sm">Align plate in frame</span>
</div>
</div>
<!-- Bottom Controls Area -->
<div class="relative z-20 pb-12 pt-4 px-6 flex flex-col items-center bg-gradient-to-t from-[#0E0F0D] via-[#0E0F0D]/80 to-transparent">
<!-- Mode Labels -->
<div class="flex items-center gap-8 mb-8">
<button class="text-[11px] font-headline tracking-wider uppercase text-on-surface-variant hover:text-on-surface transition-colors">Barcode</button>
<button class="text-[11px] font-headline tracking-wider uppercase text-tertiary font-bold relative py-1">
          Meal
          <span class="absolute bottom-0 inset-x-0 h-[2px] bg-tertiary rounded-full"></span>
</button>
<button class="text-[11px] font-headline tracking-wider uppercase text-on-surface-variant hover:text-on-surface transition-colors">Label</button>
</div>
<!-- Shutter & Secondary Actions -->
<div class="w-full max-w-xs flex items-center justify-between px-4">
<!-- Gallery Icon -->
<button class="w-12 h-12 rounded-full bg-surface-container/80 backdrop-blur-md flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-[22px]">photo_library</span>
</button>
<!-- Large White 72px Shutter Button -->
<button class="w-[72px] h-[72px] rounded-full bg-white flex items-center justify-center shadow-2xl relative active:scale-95 transition-transform group" onclick="triggerScanSuccess()">
<div class="w-[62px] h-[62px] rounded-full border-2 border-black/10 flex items-center justify-center group-hover:scale-95 transition-transform">
<div class="w-[52px] h-[52px] rounded-full bg-white shadow-inner"></div>
</div>
</button>
<!-- Keyboard / Manual Input Icon -->
<button class="w-12 h-12 rounded-full bg-surface-container/80 backdrop-blur-md flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-[22px]">keyboard</span>
</button>
</div>
</div>
</div>
<!-- Simulated Success Modal Overlay (Triggers on shutter click for delight) -->
<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex flex-col justify-end p-6 opacity-0 pointer-events-none transition-all duration-300" id="scan-modal">
<div class="bg-surface-container border border-outline-variant rounded-2xl p-6 shadow-2xl transform translate-y-8 transition-transform duration-300" id="scan-sheet">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-tertiary/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[24px]">restaurant</span>
</div>
<div>
<h3 class="font-headline font-bold text-on-surface text-lg">Salmon Poke Bowl</h3>
<p class="text-xs text-tertiary font-medium">Analyzed with 98% confidence</p>
</div>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="closeScanSuccess()">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<div class="grid grid-cols-4 gap-2 mb-6 p-3 rounded-xl bg-surface-container-low border border-outline-variant/50 text-center">
<div>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-wider">Calories</span>
<span class="font-headline font-bold text-on-surface text-sm">540</span>
</div>
<div>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-wider">Protein</span>
<span class="font-headline font-bold text-tertiary text-sm">42g</span>
</div>
<div>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-wider">Carbs</span>
<span class="font-headline font-bold text-on-surface text-sm">48g</span>
</div>
<div>
<span class="block text-[10px] text-on-surface-variant uppercase tracking-wider">Fat</span>
<span class="font-headline font-bold text-on-surface text-sm">18g</span>
</div>
</div>
<button class="w-full py-3.5 rounded-xl bg-primary text-on-primary font-headline font-semibold text-sm shadow-lg active:scale-95 transition-transform" onclick="closeScanSuccess()">
        Log to Meal Tracker
      </button>
</div>
</div>
<script>
    function triggerScanSuccess() {
      const modal = document.getElementById('scan-modal');
      const sheet = document.getElementById('scan-sheet');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      sheet.classList.remove('translate-y-8');
    }

    function closeScanSuccess() {
      const modal = document.getElementById('scan-modal');
      const sheet = document.getElementById('scan-sheet');
      modal.classList.add('opacity-0', 'pointer-events-none');
      sheet.classList.add('translate-y-8');
    }
  </script>
</div></main><nav class="fixed bottom-6 inset-x-6 z-50 pb-safe max-w-md mx-auto" data-active-classes="text-primary"><div class="relative flex items-center justify-between h-16 px-6 bg-surface-container/80 backdrop-blur-2xl rounded-full shadow-2xl"><a class="flex items-center justify-center w-12 h-12 text-on-surface-variant transition-all" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[24px]">dashboard</span></a><a class="flex items-center justify-center w-12 h-12 text-on-surface-variant transition-all" data-path="analytics" href="#"><span class="material-symbols-outlined text-[24px]">monitoring</span></a><div class="w-12"></div><a class="flex items-center justify-center w-12 h-12 text-on-surface-variant transition-all" data-path="recipes" href="#"><span class="material-symbols-outlined text-[24px]">restaurant_menu</span></a><a class="flex items-center justify-center w-12 h-12 text-on-surface-variant transition-all" data-path="profile" href="#"><span class="material-symbols-outlined text-[24px]">settings</span></a></div><div class="absolute left-1/2 -translate-x-1/2 -top-4"><a aria-current="page" class="flex items-center justify-center w-14 h-14 rounded-full bg-primary shadow-lg transition-transform active:scale-95 text-primary" data-path="scanner" href="#"><span class="material-symbols-outlined text-[28px]">barcode_scanner</span></a></div></nav></body></html>
